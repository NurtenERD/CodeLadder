<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open CodeLadder Model Layer in draw.io</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f8fafc;
    }

    main {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 24px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    p {
      line-height: 1.5;
      margin: 0 0 16px;
    }

    button,
    a.button {
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      background: #1e293b;
      color: #f8fafc;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }

    #status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.9);
      font-size: 14px;
    }

    #fallback {
      display: none;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>CodeLadder Model Layer</h1>
    <p>Deze launcher opent draw.io in een nieuw tabblad en laadt daarna automatisch het bewerkbare modeldiagram.</p>
    <button id="openBtn" type="button">Open draw.io</button>
    <a class="button" href="codeladder-core-model.drawio">Open lokaal .drawio-bestand</a>
    <div id="status">Launcher wordt gestart...</div>
    <div id="fallback">
      <p>Als je browser het nieuwe tabblad blokkeert, klik dan op <strong>Open draw.io</strong>.</p>
    </div>
  </main>

    const status = document.getElementById("status");
    const fallback = document.getElementById("fallback");
    const openBtn = document.getElementById("openBtn");
    let editorWindow = null;
    let loaded = false;

    function setStatus(message) {
      status.textContent = message;
    }

    function openEditor() {
      if (editorWindow && !editorWindow.closed) {
        editorWindow.focus();
        return;
      }

      editorWindow = window.open(drawioUrl, "_blank");

      if (!editorWindow) {
        fallback.style.display = "block";
        setStatus("Browser blokkeerde het openen van draw.io. Gebruik de knop om het handmatig te openen.");
        return;
      }

      fallback.style.display = "none";
      setStatus("draw.io is geopend. Wachten op editor...");
    }

    function sendLoad() {
      if (loaded || !editorWindow || editorWindow.closed) {
        return;
      }

      editorWindow.postMessage(JSON.stringify({
        action: "load",
        autosave: 0,
        modified: "unsavedChanges",
        xml: diagramXml
      }), "*");

      loaded = true;
      setStatus("draw.io geladen met het bewerkbare modeldiagram.");
    }

    window.addEventListener("message", (event) => {
      let data = event.data;

      if (typeof data === "string") {
        try {
          data = JSON.parse(data);
        } catch (error) {
          if (data === "ready") {
            sendLoad();
          }
          return;
        }
      }

      if (data && (data.event === "init" || data.event === "ready")) {
        sendLoad();
      }
    });

    openBtn.addEventListener("click", openEditor);
    openEditor();
  </script>
</body>
</html>
