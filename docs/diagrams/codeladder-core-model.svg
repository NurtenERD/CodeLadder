<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1120" viewBox="0 0 980 1120">
  <defs>
    <style>
      .title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .entity { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; }
      .value { fill: #fdfcf8; stroke: #64748b; stroke-width: 1.4; }
      .enum { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.4; }
      .result { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; }
      .feedback { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.4; }
      .note { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
      .name { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .enumName { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1e1b4b; }
      .feedbackName { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #7c2d12; }
      .resultName { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #064e3b; }
      .stereo { font: 11px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .body { font: 12px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 1.3; fill: none; }
      .dash { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
      .diamond { fill: #64748b; stroke: #64748b; stroke-width: 1.3; }
      .openArrow { fill: none; stroke: #64748b; stroke-width: 1.3; }
      .sep { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <text x="40" y="34" class="title">CodeLadder Model Layer</text>

  <rect x="330" y="60" width="300" height="220" rx="6" ry="6" class="entity"/>
  <line x1="330" y1="102" x2="630" y2="102" class="sep"/>
  <line x1="330" y1="180" x2="630" y2="180" class="sep"/>
  <text x="344" y="82" class="name">Exercise</text>
  <text x="344" y="97" class="stereo">&lt;&lt;entity&gt;&gt;</text>
  <text x="344" y="122" class="body">
    <tspan x="344" dy="0">- id: String</tspan>
    <tspan x="344" dy="16">- title: String</tspan>
    <tspan x="344" dy="16">- stepType: StepType</tspan>
    <tspan x="344" dy="16">- exerciseType: ExerciseType</tspan>
    <tspan x="344" dy="16">- caseStudy: CaseStudy</tspan>
    <tspan x="344" dy="16">- options: List&lt;AnswerOption&gt;</tspan>
    <tspan x="344" dy="16">- requiredFragments: Set&lt;String&gt;</tspan>
    <tspan x="344" dy="16">- codeExercise: boolean</tspan>
  </text>
  <text x="344" y="200" class="body">
    <tspan x="344" dy="0">+ getId(): String</tspan>
    <tspan x="344" dy="16">+ getStepType(): StepType</tspan>
    <tspan x="344" dy="16">+ getExerciseType(): ExerciseType</tspan>
    <tspan x="344" dy="16">+ getCaseStudy(): CaseStudy</tspan>
    <tspan x="344" dy="16">+ getOptions(): List&lt;AnswerOption&gt;</tspan>
  </text>

  <rect x="50" y="90" width="220" height="150" rx="6" ry="6" class="value"/>
  <line x1="50" y1="132" x2="270" y2="132" class="sep"/>
  <line x1="50" y1="186" x2="270" y2="186" class="sep"/>
  <text x="64" y="112" class="name">CaseStudy</text>
  <text x="64" y="127" class="stereo">&lt;&lt;value object&gt;&gt;</text>
  <text x="64" y="152" class="body">
    <tspan x="64" dy="0">- routeBlockTitle: String</tspan>
    <tspan x="64" dy="16">- title: String</tspan>
    <tspan x="64" dy="16">- description: String</tspan>
  </text>
  <text x="64" y="206" class="body">
    <tspan x="64" dy="0">+ getRouteBlockTitle()</tspan>
    <tspan x="64" dy="16">+ getTitle()</tspan>
    <tspan x="64" dy="16">+ getDescription()</tspan>
  </text>

  <rect x="700" y="90" width="220" height="130" rx="6" ry="6" class="value"/>
  <line x1="700" y1="132" x2="920" y2="132" class="sep"/>
  <line x1="700" y1="176" x2="920" y2="176" class="sep"/>
  <text x="714" y="112" class="name">AnswerOption</text>
  <text x="714" y="127" class="stereo">&lt;&lt;value object&gt;&gt;</text>
  <text x="714" y="152" class="body">
    <tspan x="714" dy="0">- id: String</tspan>
    <tspan x="714" dy="16">- label: String</tspan>
  </text>
  <text x="714" y="196" class="body">
    <tspan x="714" dy="0">+ getId(): String</tspan>
    <tspan x="714" dy="16">+ getLabel(): String</tspan>
  </text>

  <rect x="700" y="260" width="220" height="190" rx="6" ry="6" class="enum"/>
  <line x1="700" y1="302" x2="920" y2="302" class="sep"/>
  <text x="714" y="282" class="enumName">StepType</text>
  <text x="714" y="297" class="stereo">&lt;&lt;enum&gt;&gt;</text>
  <text x="714" y="326" class="body">
    <tspan x="714" dy="0">UNDERSTAND_ASSIGNMENT</tspan>
    <tspan x="714" dy="16">OBJECTS_ATTRIBUTES_METHODS</tspan>
    <tspan x="714" dy="16">CHOOSE_CLASSES</tspan>
    <tspan x="714" dy="16">WRITE_SMALL_CLASSES</tspan>
    <tspan x="714" dy="16">CONSTRUCTORS</tspan>
    <tspan x="714" dy="16">CREATE_AND_CALL_OBJECTS</tspan>
    <tspan x="714" dy="16">CLASS_RESPONSIBILITIES</tspan>
  </text>

  <rect x="700" y="490" width="220" height="200" rx="6" ry="6" class="enum"/>
  <line x1="700" y1="532" x2="920" y2="532" class="sep"/>
  <text x="714" y="512" class="enumName">ExerciseType</text>
  <text x="714" y="527" class="stereo">&lt;&lt;enum&gt;&gt;</text>
  <text x="714" y="556" class="body">
    <tspan x="714" dy="0">OPEN_QUESTION</tspan>
    <tspan x="714" dy="16">MULTIPLE_CHOICE</tspan>
    <tspan x="714" dy="16">MULTI_SELECT</tspan>
    <tspan x="714" dy="16">CATEGORY_CHOICE</tspan>
    <tspan x="714" dy="16">ERROR_ANALYSIS</tspan>
    <tspan x="714" dy="16">FILL_IN_THE_BLANK</tspan>
    <tspan x="714" dy="16">CODE_WRITING</tspan>
    <tspan x="714" dy="16">REFLECTION</tspan>
  </text>

  <rect x="330" y="340" width="300" height="190" rx="6" ry="6" class="entity"/>
  <line x1="330" y1="382" x2="630" y2="382" class="sep"/>
  <line x1="330" y1="452" x2="630" y2="452" class="sep"/>
  <text x="344" y="362" class="name">StudentAnswer</text>
  <text x="344" y="377" class="stereo">&lt;&lt;aggregate&gt;&gt;</text>
  <text x="344" y="402" class="body">
    <tspan x="344" dy="0">- exerciseId: String</tspan>
    <tspan x="344" dy="16">- exerciseTitle: String</tspan>
    <tspan x="344" dy="16">- stepType: StepType</tspan>
    <tspan x="344" dy="16">- attempts: List&lt;AttemptResult&gt;</tspan>
  </text>
  <text x="344" y="472" class="body">
    <tspan x="344" dy="0">+ addAttempt(result): void</tspan>
    <tspan x="344" dy="16">+ getLatestAttempt(): AttemptResult</tspan>
    <tspan x="344" dy="16">+ getLatestResponse(): ExerciseResponse</tspan>
    <tspan x="344" dy="16">+ getAttemptCount(): int</tspan>
    <tspan x="344" dy="16">+ isReadyForNext(): boolean</tspan>
  </text>

  <rect x="330" y="590" width="300" height="170" rx="6" ry="6" class="value"/>
  <line x1="330" y1="632" x2="630" y2="632" class="sep"/>
  <line x1="330" y1="710" x2="630" y2="710" class="sep"/>
  <text x="344" y="612" class="name">AttemptResult</text>
  <text x="344" y="627" class="stereo">&lt;&lt;value object&gt;&gt;</text>
  <text x="344" y="652" class="body">
    <tspan x="344" dy="0">- attemptNumber: int</tspan>
    <tspan x="344" dy="16">- response: ExerciseResponse</tspan>
    <tspan x="344" dy="16">- feedback: Feedback</tspan>
    <tspan x="344" dy="16">- correct: boolean</tspan>
  </text>
  <text x="344" y="730" class="body">
    <tspan x="344" dy="0">+ getResponse(): ExerciseResponse</tspan>
    <tspan x="344" dy="16">+ getFeedback(): Feedback</tspan>
    <tspan x="344" dy="16">+ isCorrect(): boolean</tspan>
  </text>

  <rect x="50" y="620" width="240" height="170" rx="6" ry="6" class="value"/>
  <line x1="50" y1="662" x2="290" y2="662" class="sep"/>
  <line x1="50" y1="710" x2="290" y2="710" class="sep"/>
  <text x="64" y="642" class="name">ExerciseResponse</text>
  <text x="64" y="657" class="stereo">&lt;&lt;value object&gt;&gt;</text>
  <text x="64" y="682" class="body">
    <tspan x="64" dy="0">- textAnswer: String</tspan>
    <tspan x="64" dy="16">- selectedOptionIds: Set&lt;String&gt;</tspan>
  </text>
  <text x="64" y="730" class="body">
    <tspan x="64" dy="0">+ empty(): ExerciseResponse</tspan>
    <tspan x="64" dy="16">+ forText(text): ExerciseResponse</tspan>
    <tspan x="64" dy="16">+ forSelections(ids): ExerciseResponse</tspan>
    <tspan x="64" dy="16">+ toDisplayText(exercise): String</tspan>
  </text>

  <rect x="700" y="730" width="220" height="130" rx="6" ry="6" class="feedback"/>
  <line x1="700" y1="772" x2="920" y2="772" class="sep"/>
  <line x1="700" y1="820" x2="920" y2="820" class="sep"/>
  <text x="714" y="752" class="feedbackName">Feedback</text>
  <text x="714" y="767" class="stereo">&lt;&lt;value object&gt;&gt;</text>
  <text x="714" y="792" class="body">
    <tspan x="714" dy="0">- message: String</tspan>
    <tspan x="714" dy="16">- type: FeedbackType</tspan>
  </text>
  <text x="714" y="840" class="body">
    <tspan x="714" dy="0">+ getMessage(): String</tspan>
    <tspan x="714" dy="16">+ getType(): FeedbackType</tspan>
  </text>

  <rect x="330" y="820" width="300" height="150" rx="6" ry="6" class="result"/>
  <line x1="330" y1="862" x2="630" y2="862" class="sep"/>
  <line x1="330" y1="910" x2="630" y2="910" class="sep"/>
  <text x="344" y="842" class="resultName">ValidationResult</text>
  <text x="344" y="857" class="stereo">&lt;&lt;result&gt;&gt;</text>
  <text x="344" y="882" class="body">
    <tspan x="344" dy="0">- correct: boolean</tspan>
    <tspan x="344" dy="16">- allowRetry: boolean</tspan>
    <tspan x="344" dy="16">- feedback: Feedback</tspan>
  </text>
  <text x="344" y="930" class="body">
    <tspan x="344" dy="0">+ isCorrect(): boolean</tspan>
    <tspan x="344" dy="16">+ isAllowRetry(): boolean</tspan>
    <tspan x="344" dy="16">+ getFeedback(): Feedback</tspan>
  </text>

  <rect x="700" y="900" width="220" height="120" rx="6" ry="6" class="enum"/>
  <line x1="700" y1="942" x2="920" y2="942" class="sep"/>
  <text x="714" y="922" class="enumName">FeedbackType</text>
  <text x="714" y="937" class="stereo">&lt;&lt;enum&gt;&gt;</text>
  <text x="714" y="966" class="body">
    <tspan x="714" dy="0">SUCCESS</tspan>
    <tspan x="714" dy="16">GUIDANCE</tspan>
    <tspan x="714" dy="16">FINAL_HINT</tspan>
  </text>

  <rect x="50" y="880" width="240" height="110" rx="6" ry="6" class="note"/>
  <text x="64" y="906" class="name">Legend</text>
  <text x="64" y="928" class="body">Stereotypes: &lt;&lt;enum&gt;&gt;, &lt;&lt;entity&gt;&gt;,</text>
  <text x="64" y="946" class="body">&lt;&lt;aggregate&gt;&gt;, &lt;&lt;value object&gt;&gt;, &lt;&lt;result&gt;&gt;</text>
  <text x="64" y="970" class="body">Multiplicities only on core associations and compositions.</text>

  <path d="M330 150 H270" class="line"/>
  <text x="282" y="138" class="small">0..*</text>
  <text x="282" y="168" class="small">1</text>
  <text x="286" y="148" class="small">caseStudy</text>

  <path d="M630 150 H700" class="line"/>
  <polygon points="630,150 640,144 650,150 640,156" class="diamond"/>
  <text x="640" y="138" class="small">1</text>
  <text x="656" y="168" class="small">0..*</text>
  <text x="650" y="148" class="small">options</text>

  <path d="M630 236 H700" class="dash"/>
  <polyline points="694,230 700,236 694,242" class="openArrow"/>
  <text x="646" y="228" class="small">typed by</text>

  <path d="M630 260 H680 V590 H700" class="dash"/>
  <polyline points="694,584 700,590 694,596" class="openArrow"/>
  <text x="642" y="454" class="small">typed by</text>

  <path d="M480 530 V590" class="line"/>
  <polygon points="480,530 490,524 500,530 490,536" class="diamond"/>
  <text x="486" y="548" class="small">1</text>
  <text x="498" y="580" class="small">0..*</text>
  <text x="494" y="560" class="small">attempts</text>

  <path d="M480 340 V290 V170" class="dash"/>
  <polyline points="474,176 480,170 486,176" class="openArrow"/>
  <text x="490" y="312" class="small">exerciseId</text>

  <path d="M630 420 H700" class="dash"/>
  <polyline points="694,414 700,420 694,426" class="openArrow"/>
  <text x="644" y="412" class="small">current step</text>

  <path d="M330 675 H290" class="line"/>
  <polygon points="330,675 320,669 310,675 320,681" class="diamond"/>
  <text x="318" y="664" class="small">1</text>
  <text x="296" y="724" class="small">1</text>
  <text x="300" y="672" class="small">response</text>

  <path d="M630 705 H700" class="line"/>
  <text x="642" y="694" class="small">1</text>
  <text x="682" y="762" class="small">1</text>
  <text x="650" y="704" class="small">feedback</text>

  <path d="M630 860 H700 V795" class="line"/>
  <text x="642" y="850" class="small">1</text>
  <text x="682" y="848" class="small">1</text>
  <text x="646" y="840" class="small">feedback</text>

  <path d="M810 860 V900" class="dash"/>
  <polyline points="804,894 810,900 816,894" class="openArrow"/>
  <text x="818" y="884" class="small">typed by</text>

  <path d="M170 620 V520 H330 V170" class="dash"/>
  <polyline points="324,176 330,170 336,176" class="openArrow"/>
  <text x="180" y="512" class="small">display labels</text>
</svg>
